name: E2E CI

on:
  pull_request:
    branches: [main, lab2-staging, lab3-staging]
  push:
    branches: [main, lab2-staging, lab3-staging]

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U toktickit -d toktickit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
      TEST_DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit_test?schema=public
      RUN_DB_INTEGRATION: "1"
      CLIENT_ORIGIN: http://127.0.0.1:4173
      LAB_SEED_INITIAL_PASSWORD: "local-lab-only-seed-password-2026"
      TEST_ATTACHMENT_STORAGE_DIR: ${{ github.workspace }}/e2e/.tmp/attachments
      E2E_API_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Create isolated test database
        env:
          PGPASSWORD: toktickit
        run: psql -h localhost -U toktickit -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE toktickit_test;"
      - name: Apply migrations
        working-directory: server
        run: npm run prisma:migrate:test
      - name: Seed reference data
        working-directory: server
        run: |
          npm run prisma:seed:test
          npm run prisma:seed:test
      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: client
        run: npm run e2e
